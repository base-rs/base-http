[package]
name = "base-http"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/base-rs/base-http"
description = "Runtime-independent HTTP semantics and bodies for Base"
readme = "readme.md"
include = ["src/**", "tests/**", "design/**", "Cargo.toml", "readme.md", "license.md"]

[workspace]
members = ["crates/http1", "crates/protocol", "crates/server", "crates/client"]
exclude = ["benchmarks"]
resolver = "3"

[dependencies]
arrayvec = "0.7.6"
base-scheduler = "0.3.0"
event-listener = "5.4.2"
smallvec = "1.15.1"

[dev-dependencies]
base-scheduler-direct = "0.3.0"
futures-lite = "2.6.1"
tempfile = "3"
