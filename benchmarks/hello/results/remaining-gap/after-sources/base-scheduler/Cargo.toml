[package]
name = "base-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/base-rs/base-scheduler"
description = "Explicit, runtime-independent scheduler capabilities for protocol libraries"
readme = "readme.md"
autoexamples = false
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = [
    "bake",
    "benchmarks/echo",
    "benchmarks/timers",
    "benchmarks/files",
    "benchmarks/buffers",
    "benchmarks/writes",
    "examples",
    "crates/conformance",
    "crates/direct",
    "crates/tokio",
    "crates/native",
    "crates/selector",
    "crates/iouring",
    "crates/timers",
]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[dependencies]
event-listener = "5.4.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dev-dependencies]
allocation-counter = "0.8.1"
futures-channel = "0.3.31"
futures-lite = "2.6.1"

[target."cfg(unix)".dev-dependencies]
libc = "0.2"
