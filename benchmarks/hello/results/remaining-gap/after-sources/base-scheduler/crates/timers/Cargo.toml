[package]
name = "base-scheduler-timers"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/base-rs/base-scheduler"
description = "Reusable batched monotonic timers with constant-time cancellation"
readme = "readme.md"

[features]
driver = ["dep:crossbeam-queue"]
sharded = []
local = []

[dependencies]
crossbeam-queue = { version = "0.3.13", optional = true }

[dev-dependencies]
loom = "0.7.2"
