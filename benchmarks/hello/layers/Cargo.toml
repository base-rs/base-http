[package]
name = "base-http-layer-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
base-scheduler = "=0.1.2"
base-scheduler-native = "=0.1.2"
base-scheduler-selector = "=0.1.2"
base-scheduler-iouring = "=0.1.2"
futures-lite = "2.6.1"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc", "async-await"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "time", "io-util"] }
mio = { version = "=1.2.4", features = ["os-poll", "os-ext", "net"] }
libc = "0.2"
serde_json = "1"

[profile.release]
debug = 1
