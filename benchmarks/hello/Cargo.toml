[package]
name = "base-http-hello-benchmark"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[features]
profile-tools = ["dep:allocation-counter", "dep:rustc-demangle"]

[[bin]]
name = "profile-symbols"
path = "src/bin/profile_symbols.rs"
required-features = ["profile-tools"]

[[bin]]
name = "allocation-probe"
path = "src/bin/allocation_probe.rs"
required-features = ["profile-tools"]

[dependencies]
base-http = { path = "../.." }
base-http-server = { path = "../../crates/server" }
base-http1 = { path = "../../crates/http1" }
base-scheduler = "=0.5.0"
base-scheduler-native = "=0.5.0"
base-scheduler-selector = "=0.5.0"
base-scheduler-tokio = "=0.5.0"
futures-lite = "2.6.1"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc", "async-await"] }
http-body-util = "0.1.3"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "time", "io-util"] }
allocation-counter = { version = "=0.8.1", optional = true }
rustc-demangle = { version = "=0.1.28", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
base-scheduler-iouring = "=0.5.0"

[profile.release]
debug = 1

# Scenarios for `base-benchmark` 0.4 and `cargo bake benchmark:* --manifest-path benchmarks/hello/Cargo.toml`. Each is a multi-process scenario: the server is the subject, a service whose ready line is the address it bound, and its backends are the variants; the client is base-benchmark-load, an external program installed at a pinned version and given with `--program load=PATH`, the same for every subject. CPU placement is given per run with `--role-cpus`, so no CPU numbers appear here; each measuring host's document in ../hosts gives its placement.
# Every client validates every response. A smoke run warns about invalid responses rather than failing on them, so the smoke arguments add `--fail-on invalid`, failing the sample instead: a correct server, raw controls included at one request outstanding per connection, never sends one. Measured runs mark the window's start 500 ms before it (`--window-lead`), rather than the client's default 100 ms, since an acknowledgement after the window's start fails the run: it tolerates five times the default's delay, though not the roughly 650 ms of one load spike, whose acknowledgement came 551 ms after the window began and which only an idle host avoids. The services' window then also covers up to 500 ms of the warmup's load, about 6% of the 8-second window, at the window's load for every subject. See readme.md.
[package.metadata.base-benchmark]
binary = "base-http-hello-benchmark"
# The full HTTP modes of the backend table in readme.md.
variants = [
    { name = "base-native", arguments = ["base-native"] },
    { name = "base-iouring", arguments = ["base-iouring"] },
    { name = "base-tokio", arguments = ["base-tokio"] },
    { name = "hyper-tokio", arguments = ["hyper-tokio"] },
    { name = "base-native-background", arguments = ["base-native-background"] },
    { name = "hyper-task-tokio", arguments = ["hyper-task-tokio"] },
]

# Closed loop: 64 persistent connections, one request outstanding on each, as the default wrk comparison in run.py. The client runs two workers, which need two physical cores: on hana, one worker was busy for 96–100% of the window in both closed-loop scenarios, and limited raw-closed to about 94% of what two workers on two cores drove, with neither of them saturated (results/client-layout-20261109).
[[package.metadata.base-benchmark.scenario]]
name = "http-closed"

[[package.metadata.base-benchmark.scenario.role]]
name = "server"
kind = "service"
subject = true
ready = "{address}"

[[package.metadata.base-benchmark.scenario.role]]
name = "client"
kind = "driver"
external = "load"
invalid-responses = "responses_invalid"
arguments = ["closed", "--address", "{server.address}", "--connections", "64", "--workers", "2", "--body", "Hello, world!", "--expect-header", "Content-Type: text/plain", "--expect-header", "Content-Length: 13"]
smoke-arguments = ["--warmup", "100ms", "--duration", "200ms", "--fail-on", "invalid"]
measure-arguments = ["--warmup", "2s", "--duration", "8s", "--window-lead", "500ms"]

# Open loop at a fixed offered rate. In base-benchmark-load's evaluation on hana (results/2026-11-09-hana), one client worker was busy for about 65% of the window at this rate, and base-native and hyper-tokio served 185,000–205,000 requests per second in the closed loop.
[[package.metadata.base-benchmark.scenario]]
name = "http-rate"

[[package.metadata.base-benchmark.scenario.role]]
name = "server"
kind = "service"
subject = true
ready = "{address}"

[[package.metadata.base-benchmark.scenario.role]]
name = "client"
kind = "driver"
external = "load"
invalid-responses = "responses_invalid"
arguments = ["rate", "--address", "{server.address}", "--rate", "100k", "--connections", "64", "--workers", "1", "--body", "Hello, world!", "--expect-header", "Content-Type: text/plain", "--expect-header", "Content-Length: 13"]
smoke-arguments = ["--warmup", "100ms", "--duration", "200ms", "--fail-on", "invalid"]
measure-arguments = ["--warmup", "2s", "--duration", "8s", "--window-lead", "500ms"]

# The raw controls read once and write one fixed response, ignoring request framing, so they serve an HTTP client correctly only with one request outstanding per connection, the client's default depth. Their response is byte-for-byte the HTTP modes', so it is checked the same way. The client runs two workers, as in http-closed.
[[package.metadata.base-benchmark.scenario]]
name = "raw-closed"
variants = [
    { name = "base-native-raw", arguments = ["base-native-raw"] },
    { name = "base-iouring-raw", arguments = ["base-iouring-raw"] },
    { name = "base-iouring-owned-raw", arguments = ["base-iouring-owned-raw"] },
    { name = "base-tokio-raw", arguments = ["base-tokio-raw"] },
    { name = "tokio-raw", arguments = ["tokio-raw"] },
    { name = "tokio-task-raw", arguments = ["tokio-task-raw"] },
]

[[package.metadata.base-benchmark.scenario.role]]
name = "server"
kind = "service"
subject = true
ready = "{address}"

[[package.metadata.base-benchmark.scenario.role]]
name = "client"
kind = "driver"
external = "load"
invalid-responses = "responses_invalid"
arguments = ["closed", "--address", "{server.address}", "--connections", "64", "--workers", "2", "--depth", "1", "--body", "Hello, world!", "--expect-header", "Content-Type: text/plain", "--expect-header", "Content-Length: 13"]
smoke-arguments = ["--warmup", "100ms", "--duration", "200ms", "--fail-on", "invalid"]
measure-arguments = ["--warmup", "2s", "--duration", "8s", "--window-lead", "500ms"]

# The raw controls at the fixed rate of http-rate, as fixed_rate.py compares them.
[[package.metadata.base-benchmark.scenario]]
name = "raw-rate"
variants = [
    { name = "base-native-raw", arguments = ["base-native-raw"] },
    { name = "base-iouring-raw", arguments = ["base-iouring-raw"] },
    { name = "base-iouring-owned-raw", arguments = ["base-iouring-owned-raw"] },
    { name = "base-tokio-raw", arguments = ["base-tokio-raw"] },
    { name = "tokio-raw", arguments = ["tokio-raw"] },
    { name = "tokio-task-raw", arguments = ["tokio-task-raw"] },
]

[[package.metadata.base-benchmark.scenario.role]]
name = "server"
kind = "service"
subject = true
ready = "{address}"

[[package.metadata.base-benchmark.scenario.role]]
name = "client"
kind = "driver"
external = "load"
invalid-responses = "responses_invalid"
arguments = ["rate", "--address", "{server.address}", "--rate", "100k", "--connections", "64", "--workers", "1", "--depth", "1", "--body", "Hello, world!", "--expect-header", "Content-Type: text/plain", "--expect-header", "Content-Length: 13"]
smoke-arguments = ["--warmup", "100ms", "--duration", "200ms", "--fail-on", "invalid"]
measure-arguments = ["--warmup", "2s", "--duration", "8s", "--window-lead", "500ms"]
