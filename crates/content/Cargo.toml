[package]
name = "base-http-content"
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/base-rs/base-http"
description = "Read request bodies into base-web-content declarations, streaming uploads to storage"
readme = "readme.md"
keywords = ["form-data", "multipart", "upload", "http", "web"]
categories = ["web-programming::http-server"]

[dependencies]
base-http = { version = "0.3.0", path = "../.." }
base-scheduler = "0.5.0"
base-web-content = "0.1.0"
base-web-media-type = "0.1.0"

[dev-dependencies]
# Unpublished test fixtures; a path-only development dependency is omitted from the published manifest.
base-http-fixtures = { path = "../fixtures" }
base-http-server = { version = "0.3.0", path = "../server" }
base-scheduler-native = "0.5.0"
futures-lite = "2.6.1"
tempfile = "3"
