[package]
name = "base-http1-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
base-http1 = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "request_head"
path = "fuzz_targets/request_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_head"
path = "fuzz_targets/response_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trailers"
path = "fuzz_targets/trailers.rs"
test = false
doc = false
bench = false

# Fuzzing needs a nightly toolchain, so this stays outside the main workspace.
[workspace]
members = ["."]
