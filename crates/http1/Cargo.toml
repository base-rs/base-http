[package]
name = "base-http1"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/base-rs/base-http"
description = "Native HTTP/1 framing over Base scheduler stream capabilities"
readme = "readme.md"

[dependencies]
base-endpoint = "0.1.0"
base-http = { version = "0.1.0", path = "../.." }
base-scheduler = "0.3.0"
smallvec = "1.15.1"

[dev-dependencies]
futures-lite = "2.6.1"
httparse = "1.10.1"

# The differential oracle compares against the previous httparse pipeline.
[target.'cfg(fuzzing)'.dependencies]
httparse = "1.10.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
