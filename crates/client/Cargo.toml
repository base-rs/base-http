[package]
name = "base-http-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/base-rs/base-http"
description = "Supervised pooled HTTP clients for Base scheduler capabilities"
readme = "readme.md"

[dependencies]
base-http-protocol = { version = "0.2.0", path = "../protocol" }
base-endpoint = "0.1.0"
base-http = { version = "0.2.0", path = "../.." }
base-http1 = { version = "0.2.0", path = "../http1" }
base-pool = "0.3.0"
base-scheduler = "0.3.0"
event-listener = "5.4.2"
async-stream = "0.3.6"
pin-project-lite = "0.2.17"
crossbeam-utils = "0.8.23"
futures-channel = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc", "async-await", "sink"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"], optional = true }

[dev-dependencies]
base-http-server = { version = "0.2.0", path = "../server" }
base-scheduler-direct = "0.3.0"
futures-lite = "2.6.1"
rcgen = "0.14.7"

[features]
rustls = ["dep:rustls", "base-endpoint/rustls", "base-http-server/rustls"]

