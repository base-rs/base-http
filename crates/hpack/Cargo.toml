[package]
name = "base-http-hpack"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/base-rs/base-http"
description = "HPACK field compression for HTTP/2, with independent encoder and decoder state and bounded, streaming decoding"
readme = "readme.md"
keywords = ["hpack", "http2", "compression", "http"]
categories = ["network-programming", "compression"]
# The conformance fixtures are large and only serve this repository's tests.
include = ["src/**", "/Cargo.toml", "/readme.md", "/license.md"]

[dev-dependencies]
# An independent HPACK codec, used only as a differential oracle in tests.
fluke-hpack = "0.3.1"
serde_json = "1.0.154"
stats_alloc = "0.1.10"
