[package]
name = "base-http-fixtures"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/base-rs/base-http"
description = "Shared test fixtures and behaviour suites for Base HTTP implementations"
readme = "readme.md"
publish = false

[dependencies]
base-http = { version = "0.2.0", path = "../.." }
base-http-client = { version = "0.2.0", path = "../client" }
base-http-server = { version = "0.2.0", path = "../server" }
base-scheduler = "0.4.0"
base-scheduler-native = "0.4.0"
event-listener = "5.4.2"
futures-lite = "2.6.1"
rcgen = { version = "0.14.7", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"], optional = true }

[features]
rustls = ["dep:rustls", "dep:rcgen", "base-http-client/rustls", "base-http-server/rustls"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2.191"
